name: CI Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Build Placeholder
        run: echo "Building the project..."

      - name: Generate Output Logs
        run: echo "Code checkout and build simulated successfully!"

      - name: Send Slack Success Notification
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"✅ GitHub Actions: CI Pipeline Build SUCCESS for devops-webapp"}' "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Send Slack Failure Notification
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"❌ GitHub Actions: CI Pipeline Build FAILED for devops-webapp"}' "${{ secrets.SLACK_WEBHOOK_URL }}"